name: Release

# Run it from the "Actions" tab (Run workflow) with a version like v1.0.1:
# it builds installers for Windows, macOS (Apple Silicon + Intel) and Linux
# and publishes them together as one GitHub release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.0.1 (bump the version in tauri.conf.json, package.json and Cargo.toml first)"
        required: true
      changes:
        description: "What changed (shown to users in the app's update window)"
        required: false
        default: "Improvements and fixes."

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest # Apple Silicon (M1 and newer)
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - platform: macos-latest # Intel Macs
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04 # .deb, .rpm and .AppImage
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust_target }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files so installed apps only accept updates from this repository.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.version }}
          releaseName: DeviceDeck ${{ github.event.inputs.version }}
          releaseBody: |
            ${{ github.event.inputs.changes }}

            ---

            | System | Download |
            | --- | --- |
            | Windows 10 / 11 | `DeviceDeck_*_x64-setup.exe` (recommended) or `.msi` |
            | macOS, Apple Silicon (M1+) | `DeviceDeck_*_aarch64.dmg` |
            | macOS, Intel | `DeviceDeck_*_x64.dmg` |
            | Linux (Debian / Ubuntu) | `.deb` |
            | Linux (Fedora / openSUSE) | `.rpm` |
            | Linux (any) | `.AppImage` |

            Free code signing for the Windows installers by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org) (application in progress; see the [code signing policy](https://github.com/${{ github.repository }}/blob/main/CODE_SIGNING.md)).
            Until then: Windows SmartScreen → "More info" → "Run anyway". macOS: if it says the app "is damaged", run `xattr -cr /Applications/DeviceDeck.app` once.
          releaseDraft: false
          args: ${{ matrix.args }}
          includeUpdaterJson: true
