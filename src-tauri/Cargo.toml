[package]
name = "devicedeck"
version = "1.0.1"
description = "See and test websites as any phone, tablet or computer"
edition = "2021"
authors = ["Dhia Mahdaoui"]
license = "AGPL-3.0-only"
publish = false

[lib]
name = "devicedeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
base64 = "0.22"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
